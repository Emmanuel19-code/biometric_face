{% extends "layout_auth.html" %}
{% block content %}

<div class="lg:col-span-2 min-h-screen -m-6 flex items-center justify-center bg-cover bg-center bg-no-repeat"
     style="background-image: linear-gradient(to right, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.2)), url('{{ url_for('static', filename='upsa-login-bg.jpeg') }}');">
<div class="w-full max-w-xl bg-white/95 border border-slate-200 rounded-md px-10 py-8 shadow-2xl">
  <div class="text-brand-600 font-extrabold tracking-wide text-xl">UPSA</div>
  <div class="text-sm text-slate-600 mt-1">Exam Facial Verification System</div>

  <form class="mt-6 space-y-4" method="POST" action="{{ url_for('web.login_page') }}">
  {% if info %}
  <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
    {{ info }}
  </div>
  {% endif %}
  {% if error %}
  <div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
    {{ error }}
  </div>
  {% endif %}
  <div>
    <label class="text-sm font-medium">Username</label>
    <input name="username" type="text" required
           class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-600/30"
           placeholder="admin">
  </div>

  <div>
    <label class="text-sm font-medium">Password</label>
    <input id="adminPassword" name="password" type="password" required
           class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-600/30"
           placeholder="********">
    <label class="mt-2 inline-flex items-center gap-2 text-xs text-slate-600">
      <input id="toggleAdminPassword" type="checkbox" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500">
      Show password
    </label>
  </div>

  <button class="w-full rounded-xl bg-brand-600 text-white py-3 font-semibold hover:bg-brand-700 transition">
    Sign in
  </button>

  <p class="text-xs text-slate-500">
    Access is restricted to authorized examination personnel.
  </p>
</form>

</div>
</div>

<script>
  (function () {
    const toggle = document.getElementById("toggleAdminPassword");
    const password = document.getElementById("adminPassword");
    if (!toggle || !password) return;
    toggle.addEventListener("change", function () {
      password.type = this.checked ? "text" : "password";
    });
  })();
</script>

{% endblock %}
